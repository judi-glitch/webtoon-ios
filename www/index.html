  <script>
    (function() {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        var ctx = canvas.getContext('2d');

        var grad = ctx.createLinearGradient(0, 0, 512, 512);
        grad.addColorStop(0, '#7e22ce');
        grad.addColorStop(1, '#1e1b4b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 512);

        ctx.strokeStyle = 'rgba(168, 85, 247, 0.35)';
        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.arc(256, 256, 200, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 150px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillText('📚', 256, 205);

        ctx.font = '900 64px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillStyle = '#f3e8ff';
        ctx.fillText('ARCHIVE', 256, 365);

        var iconUrl = canvas.toDataURL('image/png');

        var appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconUrl;
        document.head.appendChild(appleIcon);

        var favIcon = document.createElement('link');
        favIcon.rel = 'icon';
        favIcon.type = 'image/png';
        favIcon.href = iconUrl;
        document.head.appendChild(favIcon);

        var manifest = {
          name: "웹툰·소설 아카이브",
          short_name: "웹툰소설아카이브",
          start_url: ".",
          display: "standalone",
          background_color: "#0a0a0a",
          theme_color: "#0a0a0a",
          orientation: "portrait",
          icons: [
            {
              src: iconUrl,
              sizes: "512x512",
              type: "image/png",
              purpose: "any maskable"
            }
          ]
        };
        var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);
      } catch (e) {
        console.error('PWA Icon generation error:', e);
      }
    })();
  </script>

  <script>
    window.addEventListener('error', function(event) {
      var box = document.getElementById('fatal-error');
      var msg = document.getElementById('fatal-error-message');
      if (!box || !msg) return;
      var details = event.message || ('스크립트 로딩 실패: ' + (event.target && (event.target.src || event.target.href) || '알 수 없는 리소스'));
      msg.textContent = details + (event.filename ? '\n파일: ' + event.filename + ':' + event.lineno : '');
      box.style.display = 'block';
    }, true);
    window.addEventListener('unhandledrejection', function(event) {
      var box = document.getElementById('fatal-error');
      var msg = document.getElementById('fatal-error-message');
      if (box && msg) { msg.textContent = String(event.reason || '알 수 없는 비동기 오류'); box.style.display = 'block'; }
    });
  </script>

    function generateSmartWebtoonData(title) {
      let hash = 0;
      for (let i = 0; i < title.length; i++) {
        hash = (hash << 5) - hash + title.charCodeAt(i);
        hash |= 0;
      }
      const absHash = Math.abs(hash);

      const genres = ["어반 판타지 액션", "다크 아포칼립스", "퓨전 무협 판타지", "사이버펑크 레이드", "차원 침공 / 헌터물", "환생 복수극"];
      const roles = ["주인공 / 각성자", "세계선 수호자", "그림자 암살자", "원탑 능력자", "최연소 절대자"];
      const tiers = ["S+", "SS", "SS+", "SSS", "EX (규격 외)"];
      
      const selectedGenre = genres[absHash % genres.length];
      const selectedRole = roles[(absHash >> 2) % roles.length];
      const selectedTier = tiers[(absHash >> 3) % tiers.length];
      
      const basePower = 50000 + (absHash % 49000);
      const atk = 70 + (absHash % 29);
      const def = 65 + ((absHash >> 1) % 33);
      const spd = 72 + ((absHash >> 2) % 27);
      const mana = 60 + ((absHash >> 3) % 39);
      const intel = 75 + ((absHash >> 4) % 24);

      const colors = ["from-purple-900 to-slate-950", "from-rose-900 to-slate-950", "from-blue-900 to-slate-950", "from-amber-900 to-slate-950", "from-emerald-900 to-slate-950"];
      const badgeColors = ["bg-purple-600", "bg-rose-600", "bg-blue-600", "bg-amber-600", "bg-emerald-600"];

      return {
        genre: selectedGenre,
        worldSetting: `[${title}]의 고유한 법칙이 지배하는 세계. 예측할 수 없는 위기와 세력 간의 충돌 무대.`,
        characterName: `${title}의 핵심 주역`,
        characterRole: selectedRole,
        combatPower: basePower,
        combatTier: `${selectedTier} (측정 불가 전투력)`,
        stats: { attack: atk, defense: def, speed: spd, mana: mana, intellect: intel },

        themeColor: colors[absHash % colors.length],
        badgeColor: badgeColors[absHash % badgeColors.length],
        defaultReason: `스토리 전개의 신선함과 주인공의 폭발적인 성장이 인상 깊어 아카이브에 등록함!`,
        novelTitle: `${title} (원작 소설)`,
        novelAuthor: "인기 작가",
        novelPlatform: "네이버 시리즈 / 카카오페이지",

        novelCategory: "판타지 / 기타"
      };
    }

    function App() {
      const [activeTab, setActiveTab] = useState('webtoon');

      const handleNovelEdit = (item) => {

        setNovels(current => current.map(n => n.id === item.id ? { ...n, title: title.trim() || item.title, author: author.trim(), platform: platform.trim(), url: url.trim(), synopsis: synopsis.trim() } : n));
        showToast('소설 정보가 수정되었습니다.');
      };
      const handleToggleNovelTop10 = (id) => {
        const target = novels.find(n => n.id === id);
        if (!target) return;
        if (target.top10Rank) {
          const remaining = novels.filter(n => n.id !== id && Number.isInteger(n.top10Rank) && n.top10Rank >= 1 && n.top10Rank <= 10).sort((a,b) => a.top10Rank-b.top10Rank);
          const rankMap = new Map(remaining.map((n, i) => [n.id, i+1]));
          setNovels(current => current.map(n => n.id === id ? { ...n, top10Rank: null } : rankMap.has(n.id) ? { ...n, top10Rank: rankMap.get(n.id) } : n));
          showToast(`'${target.title}'을(를) 소설 TOP 10에서 제외했습니다.`); return;
        }
        const ranked = novels.filter(n => Number.isInteger(n.top10Rank) && n.top10Rank >= 1 && n.top10Rank <= 10);
        if (ranked.length >= 10) { showToast('소설 TOP 10은 최대 10개까지 등록할 수 있습니다.'); return; }
        const used = new Set(ranked.map(n => n.top10Rank)); let rank = 1; while (used.has(rank) && rank <= 10) rank++;
        setNovels(current => current.map(n => n.id === id ? { ...n, top10Rank: rank } : n));
        showToast(`'${target.title}'을(를) 소설 TOP 10 ${rank}위에 추가했습니다.`);
      };
      const moveNovelTop10 = (id, direction) => {
        const ranked = novels.filter(n => Number.isInteger(n.top10Rank) && n.top10Rank >= 1 && n.top10Rank <= 10).sort((a,b) => a.top10Rank-b.top10Rank);
        const index = ranked.findIndex(n => n.id === id), swapIndex = index + direction;
        if (index < 0 || swapIndex < 0 || swapIndex >= ranked.length) return;
        const a = ranked[index].top10Rank, b = ranked[swapIndex].top10Rank;
        setNovels(current => current.map(n => n.id === id ? { ...n, top10Rank: b } : n.id === ranked[swapIndex].id ? { ...n, top10Rank: a } : n));
      };

      const handleCreateWebtoonFolder = () => {

          setWebtoons(current => current.map(w => w.id === id

            : rankMap.has(w.id) ? { ...w, top10Rank: rankMap.get(w.id) } : w));

        const used = new Set(ranked.map(w => w.top10Rank));

        const currentRank = ranked[index].top10Rank;

                      <input value={novelAuthorInput} onChange={e => setNovelAuthorInput(e.target.value)} placeholder="작가 (선택)" className="bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2.5 text-sm text-white" />
                      <input value={novelPlatformInput} onChange={e => setNovelPlatformInput(e.target.value)} placeholder="연재 플랫폼 (예: 문피아, 카카오페이지)" className="bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2.5 text-sm text-white" />
                      <input value={novelUrlInput} onChange={e => setNovelUrlInput(e.target.value)} placeholder="작품 URL (선택)" className="bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2.5 text-sm text-white" />
                    </div>
                    <textarea value={novelSynopsisInput} onChange={e => setNovelSynopsisInput(e.target.value)} rows="2" placeholder="작품 소개 / 시놉시스 (선택)" className="w-full bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2.5 text-sm text-white" />
                    <button type="submit" className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold">+ 소설 추가</button>
                  </form>
                </section>

                <section className="bg-gradient-to-r from-indigo-950/60 to-purple-950/40 border border-indigo-900/50 rounded-2xl p-4 sm:p-5">
                  <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
                    <div><h2 className="text-lg font-bold text-white">소설 소장 폴더</h2><p className="text-xs text-neutral-400 mt-1">웹툰 폴더와 별개로 소설을 자유롭게 분류할 수 있어.</p></div>
                    <button type="button" onClick={handleCreateNovelFolder} className="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold flex items-center gap-1"><Plus className="w-3.5 h-3.5" /> 폴더 만들기</button>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={() => setSelectedNovelFolder('ALL')} className={`text-xs px-3 py-1.5 rounded-lg ${selectedNovelFolder === 'ALL' ? 'bg-indigo-600 text-white' : 'bg-neutral-900 text-neutral-300 border border-neutral-700'}`}>전체 ({novels.length})</button>
                    {novelFolders.map(folder => <button key={folder} onClick={() => setSelectedNovelFolder(folder)} className={`text-xs px-3 py-1.5 rounded-lg ${selectedNovelFolder === folder ? 'bg-indigo-600 text-white' : 'bg-neutral-900 text-neutral-300 border border-neutral-700'}`}>{folder} ({novels.filter(n => (n.folder || '미분류') === folder).length})</button>)}
                  </div>
                </section>

                <div className="space-y-3">
                  {visibleNovels.length === 0 ? (
                    <div className="text-center py-12 bg-neutral-900/50 border border-dashed border-neutral-800 rounded-2xl"><BookOpen className="w-10 h-10 text-neutral-600 mx-auto mb-3" /><p className="text-neutral-300 font-semibold">이 목록에는 소설이 없습니다.</p><p className="text-xs text-neutral-500 mt-1">위 입력란에서 소설을 추가하거나 다른 폴더를 선택해 주세요.</p></div>
                  ) : visibleNovels.map((item, index) => (
                    <div key={item.id} className="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden shadow-md">
                      <div className="p-4 flex flex-col sm:flex-row sm:items-center gap-3">
                        <div className="flex items-start gap-3 min-w-0 flex-1">
                          <div className="w-9 h-9 shrink-0 rounded-lg flex items-center justify-center bg-indigo-950 border border-indigo-800 text-indigo-300 font-black">#{index + 1}</div>
                          <div className="min-w-0 flex-1">
                            <h3 className="font-bold text-white text-base sm:text-lg break-words">{item.title}</h3>
                            <p className="text-xs text-neutral-400 mt-1">작가: {item.author || '미입력'} · 플랫폼: {item.platform || '미입력'}</p>
                            <p className="text-xs text-neutral-500 mt-1">최신화 반영: {item.lastChapterAt ? new Date(item.lastChapterAt).toLocaleString('ko-KR') : '아직 기록 없음'} · 폴더: {item.folder || '미분류'}</p>
                            {item.synopsis && <p className="text-sm text-neutral-300 mt-2 whitespace-pre-wrap">{item.synopsis}</p>}
                          </div>
                        </div>
                        <div className="flex flex-wrap items-center gap-2 sm:justify-end">
                          <button onClick={() => handleToggleNovelTop10(item.id)} className={`text-xs font-semibold px-3 py-2 rounded-lg border ${item.top10Rank ? 'bg-amber-600/20 border-amber-500 text-amber-300' : 'bg-neutral-800 border-neutral-700 text-neutral-300'}`}>{item.top10Rank ? `TOP ${item.top10Rank}` : 'TOP10 추가'}</button>
                          <button onClick={() => handleNovelUpdate(item.id)} className="text-xs bg-gradient-to-r from-amber-600 to-orange-600 text-white font-semibold px-3 py-2 rounded-lg">최신화 반영</button>
                          <select aria-label={`${item.title} 소장 폴더`} value={item.folder || '미분류'} onChange={e => setNovels(current => current.map(n => n.id === item.id ? {...n, folder: e.target.value} : n))} className="text-xs bg-neutral-800 border border-neutral-700 rounded-lg px-2 py-2 text-neutral-200">
                            {Array.from(new Set(['미분류', ...novelFolders, item.folder || '미분류'])).map(folder => <option key={folder} value={folder}>{folder}</option>)}
                          </select>
                          <button onClick={() => handleNovelEdit(item)} className="text-xs px-3 py-2 bg-neutral-800 text-neutral-200 rounded-lg border border-neutral-700">수정</button>
                          {item.url && <a href={item.url} target="_blank" rel="noopener noreferrer" className="text-xs px-3 py-2 bg-indigo-700 text-white rounded-lg flex items-center gap-1">작품 보기 <ExternalLink className="w-3.5 h-3.5" /></a>}
                          <button onClick={() => handleNovelDelete(item.id)} className="text-xs px-3 py-2 bg-neutral-800 text-rose-300 rounded-lg border border-neutral-700">삭제</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 독립 소설 TOP 10 */}
            {activeTab === 'novelTop10' && (
              <div className="space-y-5">
                <section className="bg-gradient-to-r from-amber-950/60 to-indigo-950/40 border border-amber-900/50 rounded-2xl p-5 sm:p-6">
                  <div className="flex items-center gap-3 mb-2"><Flame className="w-6 h-6 text-amber-400" /><h2 className="text-xl font-bold text-white">나만의 소설 TOP 10</h2></div>
                  <p className="text-sm text-neutral-300">소설 서재에서 TOP10 추가를 누르고, 위·아래 버튼으로 순위를 조정하세요. 웹툰 TOP 10과 별도로 저장됩니다.</p>
                </section>
                {top10Novels.length === 0 ? (
                  <div className="text-center py-14 bg-neutral-900/50 border border-dashed border-neutral-800 rounded-2xl"><Flame className="w-10 h-10 text-neutral-600 mx-auto mb-3" /><p className="text-neutral-300 font-semibold">아직 소설 TOP 10 작품이 없습니다.</p><button onClick={() => setActiveTab('novel')} className="mt-4 px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm">소설 서재로 이동</button></div>
                ) : (
                  <div className="space-y-3">{top10Novels.map((item, index) => (
                    <div key={`novel-top10-${item.id}`} className="flex items-center gap-3 p-4 rounded-xl border border-neutral-800 bg-neutral-900">
                      <div className="w-10 h-10 shrink-0 flex items-center justify-center rounded-xl bg-amber-950 border border-amber-700 text-amber-300 font-black">{item.top10Rank}</div>
                      <div className="min-w-0 flex-1"><h3 className="font-bold text-white">{item.title}</h3><p className="text-xs text-neutral-400 mt-1">{item.author || '작가 미입력'} · {item.platform || '플랫폼 미입력'} · 폴더: {item.folder || '미분류'}</p></div>
                      <div className="flex flex-col gap-1"><button disabled={index === 0} onClick={() => moveNovelTop10(item.id, -1)} className="px-2 py-1 rounded bg-neutral-800 text-xs disabled:opacity-30">▲</button><button disabled={index === top10Novels.length - 1} onClick={() => moveNovelTop10(item.id, 1)} className="px-2 py-1 rounded bg-neutral-800 text-xs disabled:opacity-30">▼</button><button onClick={() => handleToggleNovelTop10(item.id)} className="px-2 py-1 rounded bg-rose-950 text-rose-300 text-xs">제외</button></div>
                    </div>
                  ))}</div>
                )}
              </div>
            )}
          </main>

          {/* 편집 모달 (소장 분류 카테고리 수정 기능 포함) */}
          {editingItem && editForm && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-neutral-900 border border-neutral-700 w-full max-w-2xl rounded-2xl shadow-2xl p-5 sm:p-6 relative max-h-[88vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-neutral-800 pb-3 mb-4">
                  <div className="flex items-center space-x-2">
                    <Sliders className="w-5 h-5 text-purple-400" />
                    <h3 className="font-bold text-base sm:text-lg text-white">
                      [{editForm.title}] 정보 및 소장 분류 편집
                    </h3>
                  </div>
                  <button 
                    onClick={() => setEditingItem(null)} 
                    className="text-neutral-400 active:text-white p-1.5 rounded-lg bg-neutral-800"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="space-y-4 text-sm">
                  <div>
                    <label className="block text-xs font-semibold text-purple-400 mb-1">
                      입덕 코멘트 / 추천 이유
                    </label>
                    <textarea
                      rows={2}
                      value={editForm.reason}
                      onChange={(e) => setEditForm({ ...editForm, reason: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-700 rounded-xl p-3 text-neutral-100 focus:outline-none focus:border-purple-500"
                    />
                  </div>

                  <div className="bg-purple-950/20 p-3 rounded-xl border border-purple-900/40">
                    <div className="text-xs font-bold text-purple-300 mb-2 flex items-center gap-1"><BookOpen className="w-3.5 h-3.5" /> 웹툰 소장 폴더</div>
                    <label className="block text-xs text-neutral-300 mb-1">웹툰을 넣을 폴더</label>
                    <div className="flex gap-2">
                      <select value={editForm.webtoonFolder || '미분류'} onChange={(e) => setEditForm({ ...editForm, webtoonFolder: e.target.value })} className="min-w-0 flex-1 bg-neutral-950 border border-neutral-700 rounded-xl px-3 py-2 text-neutral-100 text-xs">
                        {Array.from(new Set(['미분류', ...webtoonFolderNames, editForm.webtoonFolder || '미분류'])).map(folder => <option key={folder} value={folder}>{folder}</option>)}
                      </select>
                      <button type="button" onClick={() => {
                        const name = window.prompt('새 웹툰 소장 폴더 이름을 입력하세요.');
                        if (name && name.trim()) {
                          const trimmed = name.trim();
                          if (!webtoonFolderNames.some(folder => folder.toLowerCase() === trimmed.toLowerCase())) setWebtoonFolderNames(current => [...current, trimmed]);
                          setEditForm(current => ({ ...current, webtoonFolder: trimmed }));
                        }
                      }} className="shrink-0 px-3 py-2 rounded-xl bg-purple-700 text-white text-xs font-semibold">+ 폴더</button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-neutral-300 mb-1">세계관 설정</label>
                    <textarea
                      rows={2}
                      value={editForm.worldSetting}
                      onChange={(e) => setEditForm({ ...editForm, worldSetting: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-700 rounded-xl p-3 text-neutral-100 text-xs"
                    />
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-5 border-t border-neutral-800 mt-5">
                  <button
                    type="button"
                    onClick={() => setEditingItem(null)}
                    className="px-4 py-2.5 rounded-xl bg-neutral-800 active:bg-neutral-700 text-neutral-300 text-xs font-semibold"
                  >
                    취소
                  </button>
                  <button
                    type="button"
                    onClick={handleSaveEdit}
                    className="px-5 py-2.5 rounded-xl bg-purple-600 active:bg-purple-500 text-white text-xs font-semibold flex items-center space-x-1.5 shadow-lg shadow-purple-900/40"
                  >
                    <Check className="w-4 h-4" />
                    <span>저장</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    if (!window.React || !window.ReactDOM || !window.ReactDOM.createRoot) {
      throw new Error('React 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 CDN 접근을 확인하세요.');
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
