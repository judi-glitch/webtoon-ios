name: Build iOS IPA (No Mac Required)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ipa:
    runs-on: macos-latest

    steps:
      - name: 1. 내 코드 가져오기
        uses: actions/checkout@v5

      - name: 2. Node.js 설치
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 3. Capacitor 설치 및 iOS 프로젝트 생성
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: 4. CocoaPods 의존성 설치 (필수!)
        run: |
          cd ios/App
          pod install

      - name: 5. Xcode로 서명 없는 앱(.app) 빌드하기
        run: |
          cd ios/App
          # App.xcodeproj 대신 App.xcworkspace를 사용해야 에러 65가 안 납니다!
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: 6. 아이폰 설치 파일(.ipa)로 압축 포장하기
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r WebtoonLab.ipa Payload

      - name: 7. 완성된 .ipa 파일 다운로드 가능하게 올리기
        uses: actions/upload-artifact@v5
        with:
          name: WebtoonLab-iOS-IPA
          path: WebtoonLab.ipa
